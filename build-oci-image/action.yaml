name: Build OCI Image
description: |-
  Build multi-platform OCI images using buildkitd and buildctl.
  See https://github.com/moby/buildkit/blob/master/docs/reference/buildctl.md

  All inputs that accept multi-line values ignore empty lines
  and lines whose first character is `#`.

inputs:

  ## --local: Allow build access to the local directory.

  local:
    description: |-
      Allow build access to the local directory, one pair per line.
      Maps to `--local <name>=<dir>`.
    required: false
    default: ""

  ## --opt: Define custom options for frontend.

  cross-arch-emulation:
    description: |-
      Install qemu-user-binfmt (available in Debian / Ubuntu) for cross-architecture emulation.
      Set to "false" to skip.
    required: false
    default: "true"

  platform:
    description: |-
      Target platforms, one per line.
      Maps to `--opt platform=<platform>,...`.
      Defaults to `linux/amd64` and `linux/arm64/v8`.
      See https://github.com/moby/buildkit/blob/8e99dc1f10bf903712c228b49405d6f9b3d835c8/docs/multi-platform.md
    required: false
    default: |-
      linux/amd64
      linux/arm64/v8

  context:
    description: |-
      Build context.
      Maps to `--opt context=<context>`.

      When `--local context=`, `--local dockerfile=` and `--opt context=` are all not specified, `--opt context=` defaults to current GitHub repository, authenticate by GITHUB_TOKEN, fetch by commit, ref name applied locally, submodules synchronized.
      Otherwise, this flag is omitted when not specified.
    required: false
    default: ""

  # GitRef allows the following query param within context URL:
  #  - `ref=`
  #  - `branch=`
  #  - `tag=`
  #  - `subdir=<relative-path>`
  #  - `checksum=<commit>`/`commit=<commit>`
  #  - `keep-git-dir=<bool>`
  #  - `submodules=<bool>`
  #  - `fetch-by-commit=<bool>`
  #  - `mtime=checkout/commit`
  # See https://github.com/moby/buildkit/blob/1b593c4e017de3980fb2084249fce3136d6c9498/frontend/dockerfile/dfgitutil/git_ref.go#L181.

  additional-context:
    description: |-
      Additional build contexts, one pair per line.
      Maps to `--opt context:<source>=<target>`.
    required: false
    default: ""

  build-arg:
    description: |-
      Build arguments, one pair per line.
      Maps to `--opt build-arg:<key>=<value>`.
    required: false
    default: ""

  target:
    description: |-
      Name of the target stage to be built.
      Maps to `--opt target=<target>`. Omitted when not specified.
    required: false
    default: ""

  sbom:
    description: |-
      Generate and attach SBOM attestation.
      Maps to `--opt attest:sbom=...`. Omitted when not specified.
      See https://github.com/moby/buildkit/blob/8e99dc1f10bf903712c228b49405d6f9b3d835c8/docs/attestations/sbom.md
    required: false
    default: ""

  provenance:
    description: |-
      Generate and attach provenance attestation.
      Maps to `--opt attest:provenance=...`. Omitted when not specified.
      See https://github.com/moby/buildkit/blob/8e99dc1f10bf903712c228b49405d6f9b3d835c8/docs/attestations/slsa-provenance.md
    required: false
    default: ""

  ## --output: Define exports for build result.

  image:
    description: |-
      OCI image name — MUST include the registry host.
      Maps to `--output image,name=<image>:<image-tag>,...`.
      Defaults to `ghcr.io/<owner>/<repo>`.
    required: false
    default: ghcr.io/${{ github.repository }}

  image-tag:
    description: |-
      Image tags, one per line.
      Maps to `--output image,name=<image>:<image-tag>,...`.
      Defaults to `latest`.
    required: false
    default: latest

  annotation:
    description: |-
      OCI annotations, one per line.
      Maps to `--output image,<annotation-type>[<platform>].<key>=<value>,...`.
      See https://github.com/moby/buildkit/blob/8e99dc1f10bf903712c228b49405d6f9b3d835c8/docs/annotations.md
    required: false
    default: ""

  push:
    description: |-
      Push the image to the registry.
      Maps to `--output image,push=<push>,...`.
      Defaults to false.
    required: false
    default: "false"

  store:
    description: |-
      Store the result images in the image store.
      Maps to `--output image,store=<store>,...`.
      Defaults to true.
    required: false
    default: "true"

  ## registry authentication credential

  registry-username:
    description: |-
      Username for registry authentication.
      Defaults to `github.actor` when image matches `ghcr.io/*`.
    required: false
    default: ""

  registry-password:
    description: |-
      Password / token for registry authentication.
      Defaults to `github.token` when image matches `ghcr.io/*`.
    required: false
    default: ""


runs:
  using: composite
  steps:

    - name: Setup QEMU user emulation
      if: inputs.cross-arch-emulation == 'true'
      shell: bash
      run: |-
        sudo apt-get update -qq
        sudo apt-get install -y -qq -o Dpkg::Use-Pty=0 qemu-user-binfmt

    - name: Start buildkitd
      shell: bash
      run: |-
        docker inspect buildkitd >/dev/null 2>&1 || {
          CONFIG_FILE=$(mktemp)
          printf '[worker.oci]\nmax-parallelism = %d\n' "$(nproc)" >"${CONFIG_FILE}"
          docker run -d --name buildkitd --privileged -v ${CONFIG_FILE}:/etc/buildkit/buildkitd.toml:ro moby/buildkit:latest
        }
        command -v buildctl >/dev/null 2>&1 || {
          docker cp buildkitd:/usr/bin/buildctl /usr/local/bin/buildctl
        }
        if [ -z "${BUILDKIT_HOST:-}" ]; then
          echo "BUILDKIT_HOST=docker-container://buildkitd" >> "${GITHUB_ENV}"
        fi

    - name: Show buildkitd/dockerfile/buildctl version
      shell: bash
      run: |-
        buildctl debug info
        buildctl --version

    - name: Log in to image registry
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |-
        set -u

        case "${IMAGE}" in
          ghcr.io/*)
            [ -z "${REGISTRY_USERNAME}" ] && [ -z "${REGISTRY_PASSWORD}" ] && {
              REGISTRY_USERNAME="${GITHUB_ACTOR}"
              REGISTRY_PASSWORD="${GITHUB_TOKEN}"
            }
            ;;
        esac
        if [ -n "${REGISTRY_USERNAME}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
          docker login --username "${REGISTRY_USERNAME}" --password-stdin "${IMAGE%%/*}" <<< "${REGISTRY_PASSWORD}"
        fi

    - name: Build OCI image
      env:
        GITHUB_TOKEN: ${{ github.token }} 
        LOCAL: ${{ inputs.local }}
        PLATFORM: ${{ inputs.platform }}
        CONTEXT: ${{ inputs.context }}
        ADDITIONAL_CONTEXT: ${{ inputs.additional-context }}
        BUILD_ARG: ${{ inputs.build-arg }}
        TARGET: ${{ inputs.target }}
        SBOM: ${{ inputs.sbom }}
        PROVENANCE: ${{ inputs.provenance }}
        IMAGE: ${{ inputs.image }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        ANNOTATION: ${{ inputs.annotation }}
        PUSH: ${{ inputs.push }}
        STORE: ${{ inputs.store }}
      shell: bash
      run: |-
        set -u

        ARGS=()
        ARGS+=(--progress plain)
        ARGS+=(--frontend dockerfile.v0)

        NO_DEFAULT_CONTEXT=
        while IFS= read -r LINE; do
          case "${LINE}" in \#*) continue ;; esac
          [ -z "${LINE}" ] && continue
          ARGS+=(--local "${LINE}")
          case "${LINE}" in context=*|dockerfile=*) NO_DEFAULT_CONTEXT=1 ;; esac
        done <<< "${LOCAL}"

        PLATFORM_CSL=
        while IFS= read -r LINE; do
          case "${LINE}" in \#*) continue ;; esac
          [ -z "${LINE}" ] && continue
          PLATFORM_CSL="${PLATFORM_CSL},${LINE}"
        done <<< "${PLATFORM}"
        ARGS+=(--opt "platform=${PLATFORM_CSL:1}")
        unset PLATFORM_CSL

        if [ -z "${CONTEXT}"] && [ -z "${NO_DEFAULT_CONTEXT}" ]; then
          CONTEXT="${GITHUB_SERVER_URL%%//*}//x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#*//}/${GITHUB_REPOSITORY}.git?ref=$(jq -nr 'env.GITHUB_REF | @uri')&commit=${GITHUB_SHA}&keep-git-dir=true&submodules=true&fetch-by-commit=true"
        fi
        if [ -n "${CONTEXT}" ]; then
          ARGS+=(--opt "context=${CONTEXT}")
        fi

        while IFS= read -r LINE; do
          case "${LINE}" in \#*) continue ;; esac
          [ -z "${LINE}" ] && continue
          ARGS+=(--opt "context:${LINE}")
        done <<< "${ADDITIONAL_CONTEXT}"

        while IFS= read -r LINE; do
          case "${LINE}" in \#*) continue ;; esac
          [ -z "${LINE}" ] && continue
          ARGS+=(--opt "build-arg:${LINE}")
        done <<< "${BUILD_ARG}"

        if [ -n "${TARGET}" ]; then
          ARGS+=(--opt "target=${TARGET}")
        fi

        if [ -n "${SBOM}" ]; then
          ARGS+=(--opt "attest:type=sbom,${SBOM}")
        fi

        if [ -n "${PROVENANCE}" ]; then
          ARGS+=(--opt "attest:type=provenance,${PROVENANCE}")
        fi

        ## --output type=image,...
        if [ "${PUSH}" = true ] || [ "${STORE}" = true ]; then
          OUTPUT=type=image
          OUTPUT=${OUTPUT},oci-mediatypes=true

          ## --output image,name=<image>:<tag>,...
          while IFS= read -r LINE; do
            case "${LINE}" in \#*) continue ;; esac
            [ -z "${LINE}" ] && continue
            OUTPUT="${OUTPUT},name=${IMAGE}:${LINE}"
          done <<< "${IMAGE_TAG}"

          ## --output image,<annotation-type>[<platform>].<key>=<value>,...
          while IFS= read -r LINE; do
            case "${LINE}" in \#*) continue ;; esac
            [ -z "${LINE}" ] && continue
            OUTPUT="${OUTPUT},${LINE}"
          done <<< "${ANNOTATION}"

          if [ "${PUSH}" = true ]; then
            OUTPUT=${OUTPUT},push=true
          fi

          if [ "${STORE}" = false ]; then
            OUTPUT=${OUTPUT},store=false
          fi

          ARGS+=(--output "${OUTPUT}")
        fi

        buildctl build "${ARGS[@]}"
